position = 2
title = "El doble de un número"
prompt = '''
Este programa debería mostrar el doble del número que escribe la persona, pero si escribe `4` muestra `44`. Corrígelo para que muestre `8`.
'''
starter_code = '''
numero = input("Escribe un número: ")
print(numero * 2)
'''
solution = '''
numero = int(input("Escribe un número: "))
print(numero * 2)
'''
checks = [
  { kind = "output", id = "cuatro", description = "El doble de 4 es 8", stdin = ["4"], expected_stdout = "8\n" },
  { kind = "output", id = "quince", description = "El doble de 15 es 30", stdin = ["15"], expected_stdout = "30\n" },
]
status = "published"
