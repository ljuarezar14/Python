id = "pedir-datos-con-input"
module = "primeros-pasos"
position = 5
title = "Pedir datos con input()"
summary = "Haz programas que preguntan: lee lo que escribe la persona y conviértelo en número para calcular."
objectives = [
  "Leer un dato con input() y guardarlo en una variable",
  "Convertir el texto leído en número con int()",
  "Combinar input(), cálculos y f-strings en un programa",
]
prerequisites = ["trabajar-con-textos"]
status = "published"
version = 1
content = '''
# Preguntar a la persona

`input()` detiene el programa, espera a que la persona escriba algo y devuelve lo que escribió. Lo habitual es guardarlo en una variable:

```python
nombre = input("¿Cómo te llamas? ")
print(f"Hola, {nombre}")
```

El texto entre paréntesis es la **pregunta** que ve la persona. Si escribe `Ana`, la pantalla muestra `Hola, Ana`.

# Cómo se prueba en PyRaíz

En los ejercicios de esta lección, cada prueba escribe los datos por ti y comprueba lo que muestra tu programa. La pregunta de `input()` no cuenta como parte de la salida, así que puedes escribir la que quieras.

En el **Editor** de práctica libre, `input()` todavía no está disponible: practica esta lección con los ejercicios.

# input() siempre devuelve texto

Aunque la persona escriba un número, `input()` lo devuelve como texto. Por eso este programa no hace lo que parece:

```python
numero = input("Escribe un número: ")
print(numero * 2)
```

Si la persona escribe `4`, la pantalla muestra `44`: multiplicar un texto por 2 lo repite. Para calcular, convierte el texto en número entero con `int()`:

```python
numero = int(input("Escribe un número: "))
print(numero * 2)
```

Ahora la pantalla muestra `8`.

# Errores frecuentes

- Calcular con lo que devuelve `input()` sin convertirlo: `+` une textos (`"2" + "3"` da `"23"`) y `*` los repite.
- Si la persona escribe algo que no es un número entero, como `hola` o `2.5`, `int()` produce un `ValueError`.
- Olvidar cerrar los dos paréntesis en `int(input("…"))` produce un `SyntaxError`.
'''

[[exercises]]
id = "input-saludo"
position = 1
title = "Un saludo personal"
prompt = '''
Lee un nombre con `input()` y muestra `Hola, ` seguido del nombre. Por ejemplo, si la persona escribe `Ana`, muestra `Hola, Ana`.
'''
starter_code = '''
nombre = input("¿Cómo te llamas? ")
# Saluda usando la variable nombre
'''
solution = '''
nombre = input("¿Cómo te llamas? ")
print(f"Hola, {nombre}")
'''
checks = [
  { kind = "output", id = "ana", description = "Saluda a Ana", stdin = ["Ana"], expected_stdout = "Hola, Ana\n" },
  { kind = "output", id = "mateo", description = "Saluda a Mateo", stdin = ["Mateo"], expected_stdout = "Hola, Mateo\n" },
]
status = "published"
version = 1

[[exercises]]
