precio = 2
print(f"El {producto} cuesta {precio} euros")
'''
checks = [
  { kind = "output", id = "mensaje", description = "Muestra El pan cuesta 2 euros", expected_stdout = "El pan cuesta 2 euros\n" },
]
status = "published"
version = 1

[[exercises]]
id = "textos-corregir-error"
position = 3
title = "Corrige el TypeError"
prompt = '''
Este programa quiere mostrar `Tengo 15 años`, pero produce un `TypeError`. Pulsa **Comprobar** para ver el error y corrígelo sin cambiar el valor de `edad`.
'''
