position = 1
title = "Nombre completo"
prompt = '''
Muestra el nombre completo uniendo las variables `nombre` y `apellido` con `+`, con un espacio entre ellas.
'''
starter_code = '''
nombre = "Ana"
apellido = "López"
# Une nombre y apellido con un espacio entre ellos
'''
solution = '''
nombre = "Ana"
apellido = "López"
print(nombre + " " + apellido)
'''
checks = [
  { kind = "output", id = "completo", description = "Muestra Ana López", expected_stdout = "Ana López\n" },
]
status = "published"
version = 1

[[exercises]]
