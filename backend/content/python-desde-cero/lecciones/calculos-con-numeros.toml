Haz que Python calcule y muestre el resultado de sumar `25` y `17`.

Escribe la operación dentro de `print()`, sin comillas; no escribas el resultado a mano.
'''
starter_code = '''
# Escribe la suma dentro de print()
'''
solution = '''
print(25 + 17)
'''
