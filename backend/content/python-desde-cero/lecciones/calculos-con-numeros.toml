]
prerequisites = ["mostrar-mensajes"]
status = "published"
version = 1
content = '''
# Python como calculadora

Si das a `print()` una operación en lugar de un texto, Python la calcula y muestra el resultado:

```python
print(7 + 5)
print(10 - 4)
print(6 * 3)
print(9 / 2)
```

La pantalla muestra `12`, `6`, `18` y `4.5`, cada uno en su línea. Para multiplicar se usa `*` y para dividir, `/`.

# Texto u operación

Las comillas cambian todo. Sin comillas, Python calcula; con comillas, muestra el texto tal cual:

```python
print(2 + 3)
print("2 + 3")
```

La primera línea muestra `5` y la segunda, `2 + 3`.

# El orden de las operaciones

Como en matemáticas, Python multiplica y divide antes de sumar y restar. Para cambiar ese orden, usa paréntesis:

```python
print(2 + 3 * 4)
print((2 + 3) * 4)
```

La primera línea muestra `14` y la segunda, `20`.

# Decimales y divisiones

- Los decimales se escriben con **punto**: `2.5`, no `2,5`.
- `/` siempre da un número decimal, aunque la división sea exacta: `print(8 / 2)` muestra `4.0`.
- `//` da el cociente entero y `%` el resto. Al repartir 7 caramelos entre 2 personas, `7 // 2` es `3` (caramelos para cada una) y `7 % 2` es `1` (el que sobra).

# Errores frecuentes

- `print(3,5)` no muestra un decimal: la coma separa dos valores y la pantalla muestra `3 5`. Escribe `3.5`.
- Dividir entre cero no está permitido: `print(5 / 0)` produce un `ZeroDivisionError`.
- Si el resultado no es el que esperabas, revisa el orden de las operaciones y añade paréntesis.
'''

[[exercises]]
