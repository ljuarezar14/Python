id = "calculos-con-numeros"
module = "primeros-pasos"
position = 2
title = "Hacer cálculos con números"
summary = "Usa Python como calculadora: suma, resta, multiplica y divide, y controla el orden de las operaciones."
objectives = [
  "Calcular con los operadores +, -, * y /",
  "Usar paréntesis para decidir el orden de las operaciones",
