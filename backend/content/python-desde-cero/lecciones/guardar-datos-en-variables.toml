content = '''
# Qué es una variable

Una **variable** es un nombre que guarda un dato. Se crea escribiendo el nombre, el signo `=` y el valor:

```python
edad = 15
ciudad = "Lima"
```

Desde ese momento, `edad` vale `15` y `ciudad` vale `"Lima"`. El signo `=` no significa «es igual» como en matemáticas: significa «guarda este valor con este nombre».

# Usar una variable

Para usar el dato, escribe el nombre de la variable **sin comillas**:

```python
precio = 12
cantidad = 3
print(precio * cantidad)
print("precio")
```

La primera línea de salida es `36`, porque Python usa los valores guardados. La segunda es `precio`: entre comillas, es solo un texto.

# Cambiar el valor

Si vuelves a usar `=` con el mismo nombre, el valor anterior se reemplaza. Python lee el programa de arriba abajo y usa el último valor guardado:

```python
puntos = 10
puntos = puntos + 5
print(puntos)
```

La pantalla muestra `15`. La segunda línea se lee así: «calcula `puntos + 5` y guarda el resultado otra vez en `puntos`».

# Cómo elegir nombres

- Usa letras, números y guion bajo, como `precio_total`. No uses espacios ni tildes.
- El nombre no puede empezar por un número: `1precio` no es válido.
- Las mayúsculas importan: `precio` y `Precio` son variables distintas. Lo habitual es escribir en minúsculas.
- Elige nombres que expliquen el dato: `edad` es más claro que `x`.

# Errores frecuentes

- Usar una variable antes de crearla, o escribir mal su nombre, produce un `NameError`. El mensaje dice qué nombre no reconoce.
- Escribir el nombre entre comillas muestra el texto, no el valor.
- Escribir `15 = edad` produce un `SyntaxError`: el nombre siempre va a la izquierda del `=`.
'''

[[exercises]]
id = "variables-mostrar"
position = 1
title = "Mostrar una variable"
